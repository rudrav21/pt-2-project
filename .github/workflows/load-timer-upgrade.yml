name: Load LOCK IN timer upgrade
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  inject:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject timer script into index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="/timer-upgrade.js"></script>'
          if tag not in s:
              marker='</body>'
              if marker not in s:
                  raise SystemExit('Could not find </body> in index.html')
              s=s.replace(marker, tag+'\n'+marker, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit injection
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Load LOCK IN timer upgrade'
          git push
