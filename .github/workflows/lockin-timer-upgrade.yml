name: LOCK IN timer upgrade
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  upgrade:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply timer upgrade
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          def must(old,new,name,count=1):
              global s
              if old not in s:
                  raise SystemExit(f'pattern missing: {name}')
              s=s.replace(old,new,count)

          # Persistent timer upgrade state.
          must("state.timer ||= {mode:'focus',remaining:1500,running:false,endAt:0};",
               "state.timer ||= {mode:'focus',remaining:1500,running:false,endAt:0}; state.timer.smartPreset ||= '50-10'; state.timer.smartFocusSeconds ||= 3000; state.timer.smartBreakSeconds ||= 600; state.timer.stopwatchRewards ||= {};",
               'timer state')

          # Add Smart Pomodoro data + fair one-time stopwatch reward tiers.
          must("const durations={focus:1500,short:300,long:900,stopwatch:0};",
               """const durations={focus:1500,short:300,long:900,stopwatch:0};
const smartPomodoroPresets={'25-5':{focus:1500,break:300,label:'25 / 5'},'50-10':{focus:3000,break:600,label:'50 / 10'},'75-15':{focus:4500,break:900,label:'75 / 15'},'90-20':{focus:5400,break:1200,label:'90 / 20'}};
const stopwatchRewardTiers=[{min:10,xp:10,coins:5},{min:25,xp:25,coins:10},{min:50,xp:50,coins:20},{min:90,xp:90,coins:35}];
function smartPreset(){return smartPomodoroPresets[state.timer.smartPreset]||smartPomodoroPresets['50-10']}
function applySmartPreset(key,autostart=false){const p=smartPomodoroPresets[key];if(!p)return;clearInterval(timer.interval);state.timer.smartPreset=key;state.timer.smartFocusSeconds=p.focus;state.timer.smartBreakSeconds=p.break;state.timer.preset='smart';timer.mode='focus';timer.running=false;timer.remaining=p.focus;timer.startedAt=0;saveTimer();renderSmartPomodoro();updateClockUI();if(autostart)startTimer()}
function renderSmartPomodoro(){const p=smartPreset();const label=document.getElementById('smartPresetLabel');if(label)label.textContent=`SMART ${p.label}`;document.querySelectorAll('[data-smart-preset]').forEach(b=>b.classList.toggle('active',b.dataset.smartPreset===state.timer.smartPreset))}
function awardStopwatchReward(seconds){const minutes=Math.floor(Math.max(0,seconds)/60);let tier=null;for(const t of stopwatchRewardTiers)if(minutes>=t.min)tier=t;if(!tier)return {xp:0,coins:0,label:'UNDER 10 MIN // NO REWARD'};const key=tier.min+'m';state.timer.stopwatchRewards ||= {};if(state.timer.stopwatchRewards[key])return {xp:0,coins:0,label:'REWARD ALREADY CLAIMED'};state.timer.stopwatchRewards[key]={claimedAt:Date.now(),seconds};awardXp(tier.xp,'stopwatch','STOPWATCH REWARD');state.coins+=tier.coins;return {xp:tier.xp,coins:tier.coins,label:`${tier.min} MIN SPRINT`}}
""",
               'timer durations')

          # Make the timer save the smart end time as usual; only the selected duration changes.
          # Keep classic modes fully intact.

          # Stopwatch rewards: pause/reset a genuine 10+ minute run, once per reward tier.
          old="function pauseTimer(){timer.running=false;clearInterval(timer.interval);if(timer.mode==='stopwatch'&&timer.remaining){state.sessions.unshift({type:'STOPWATCH',seconds:timer.remaining,at:Date.now()});state.sessions=state.sessions.slice(0,180)}saveTimer();update();}"
          new="""function pauseTimer(){timer.running=false;clearInterval(timer.interval);if(timer.mode==='stopwatch'&&timer.remaining){state.sessions.unshift({type:'STOPWATCH',seconds:timer.remaining,at:Date.now()});state.sessions=state.sessions.slice(0,180);if(timer.remaining>=600){const r=awardStopwatchReward(timer.remaining);if(r.xp||r.coins){showToast(`STOPWATCH REWARD // +${r.xp} XP // +${r.coins} COINS`);playSfx('complete')}}}saveTimer();update();}"""
          if old in s: s=s.replace(old,new,1)
          else: raise SystemExit('pattern missing: pauseTimer')

          old="function resetTimer(){clearInterval(timer.interval);timer.running=false;timer.remaining=durations[timer.mode];timer.startedAt=0;saveTimer();updateClockUI()}"
          new="""function resetTimer(){clearInterval(timer.interval);const wasRunning=timer.running;const elapsed=timer.mode==='stopwatch'?timer.remaining:0;timer.running=false;if(timer.mode==='stopwatch'&&wasRunning&&elapsed>=600){const r=awardStopwatchReward(elapsed);if(r.xp||r.coins){showToast(`STOPWATCH BANKED // +${r.xp} XP // +${r.coins} COINS`);playSfx('complete')}}timer.remaining=durations[timer.mode];timer.startedAt=0;saveTimer();update()}"""
          if old in s: s=s.replace(old,new,1)
          else: raise SystemExit('pattern missing: resetTimer')

          # Smart focus uses the selected focus length for logs/rewards, and the selected break on completion.
          must("state.smartDaily.focusMinutes+=Math.max(1,Math.round(durations.focus/60));",
               "state.smartDaily.focusMinutes+=Math.max(1,Math.round((state.timer.preset==='smart'?state.timer.smartFocusSeconds:durations.focus)/60));",
               'smart focus minutes')
          must("state.sessions.unshift({type:'FOCUS',seconds:durations.focus,at:Date.now()});",
               "state.sessions.unshift({type:'FOCUS',seconds:(state.timer.preset==='smart'?state.timer.smartFocusSeconds:durations.focus),at:Date.now()});",
               'smart focus session')
          must("const next=state.rounds%4===0?'long':'short';setMode(next,state.settings.autoStart);",
               "const next=state.timer.preset==='smart'?'smart':(state.rounds%4===0?'long':'short');if(next==='smart'){timer.mode='short';timer.running=false;timer.remaining=state.timer.smartBreakSeconds;timer.startedAt=0;saveTimer();updateClockUI();if(state.settings.autoStart)startTimer();showToast(`SMART BREAK // ${Math.round(state.timer.smartBreakSeconds/60)} MIN`)}else setMode(next,state.settings.autoStart);",
               'smart break switch')

          # Smart Pomodoro UI.
          marker='          <button class="btn" data-mode="stopwatch">STOPWATCH</button>\n          </div>'
          addition='''          <button class="btn" data-mode="stopwatch">STOPWATCH</button>\n          </div>\n          <div class="smartPomoBox">\n            <div class="smartPomoHead"><span>SMART POMODORO</span><b id="smartPresetLabel">SMART 50 / 10</b></div>\n            <div class="smartPomoChoices">\n              <button class="btn" type="button" data-smart-preset="25-5">25 / 5</button>\n              <button class="btn active" type="button" data-smart-preset="50-10">50 / 10</button>\n              <button class="btn" type="button" data-smart-preset="75-15">75 / 15</button>\n              <button class="btn" type="button" data-smart-preset="90-20">90 / 20</button>\n            </div>\n            <div class="smartPomoHint">FOCUS → BREAK // AUTO-SWITCH AFTER A COMPLETED FOCUS</div>\n          </div>'''
          must(marker,addition,'smart UI')

          css='''.smartPomoBox{margin-top:14px;padding:11px;border:1px solid var(--line);border-radius:11px;background:linear-gradient(135deg,var(--soft),rgba(255,255,255,.012));position:relative;overflow:hidden}.smartPomoHead{display:flex;justify-content:space-between;gap:10px;align-items:center;font:800 9px "DM Mono",monospace;letter-spacing:.09em;color:var(--muted)}.smartPomoHead b{color:var(--orange2)}.smartPomoChoices{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.smartPomoChoices .btn{min-height:30px;padding:5px 4px;font-size:8px}.smartPomoChoices .btn.active{background:var(--soft);border-color:var(--orange2);color:var(--orange2);box-shadow:0 0 14px var(--soft)}.smartPomoHint{margin-top:7px;color:var(--muted);font:700 7px/1.4 "DM Mono",monospace;letter-spacing:.05em}@media(max-width:600px){.smartPomoChoices{grid-template-columns:repeat(2,1fr)}}\n'''
          if '.smartPomoBox{' not in s:
              s=s.replace('</style>',css+'</style>',1)

          wire="document.getElementById('startBtn').onclick=startTimer;document.getElementById('pauseBtn').onclick=pauseTimer;document.getElementById('resetBtn').onclick=resetTimer;"
          must(wire,wire+"document.querySelectorAll('[data-smart-preset]').forEach(b=>b.onclick=()=>applySmartPreset(b.dataset.smartPreset));renderSmartPomodoro();",'smart wiring')

          # Ensure a fresh install defaults to 50/10 visually, without overwriting an existing user choice.
          p.write_text(s,encoding='utf-8')
          print('timer upgrade applied')
          PY
      - name: Commit completed upgrade
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/lockin-timer-upgrade.yml
          git add index.html
          git diff --cached --check
          git commit -m "[skip ci] Add Smart Pomodoro and stopwatch rewards"
          git push origin HEAD:main
